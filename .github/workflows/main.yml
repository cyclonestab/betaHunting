# .github/workflows/ci.yml

name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Debug — list files    # ← add this to see what is checked out
        run: |
          pwd
          ls -la
          ls -la tests/ || echo "tests/ folder not found"

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install pytest numpy scikit-learn

      - name: Run tests
        run: |
          pytest tests/test_pipeline.py -v
